services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OILSIGNAL_DATA_DIR: /data
      OILSIGNAL_EIA_API_KEY: ${EIA_API_KEY:-}
      OILSIGNAL_LLM_BASE_URL: ${OILSIGNAL_LLM_BASE_URL:-}
      OILSIGNAL_LLM_API_KEY: ${OILSIGNAL_LLM_API_KEY:-}
      OILSIGNAL_LLM_MODEL: ${OILSIGNAL_LLM_MODEL:-}
      OILSIGNAL_AGENT_EVIDENCE_PACK_PRICE_USD: ${OILSIGNAL_AGENT_EVIDENCE_PACK_PRICE_USD:-}
      OILSIGNAL_AGENT_PRICE_CURRENCY: ${OILSIGNAL_AGENT_PRICE_CURRENCY:-}
      OILSIGNAL_AGENT_PAYMENT_GATEWAY_URL: ${OILSIGNAL_AGENT_PAYMENT_GATEWAY_URL:-}
      OILSIGNAL_AGENT_PAYMENT_GATEWAY_PROTOCOL: ${OILSIGNAL_AGENT_PAYMENT_GATEWAY_PROTOCOL:-}
      OILSIGNAL_AGENT_PAYMENT_GATEWAY_CREDENTIAL_HEADERS: ${OILSIGNAL_AGENT_PAYMENT_GATEWAY_CREDENTIAL_HEADERS:-}
      OILSIGNAL_AGENT_PAYMENT_GATEWAY_BEARER_TOKEN: ${OILSIGNAL_AGENT_PAYMENT_GATEWAY_BEARER_TOKEN:-}
      OILSIGNAL_AGENT_PAYMENT_GATEWAY_TIMEOUT_SECONDS: ${OILSIGNAL_AGENT_PAYMENT_GATEWAY_TIMEOUT_SECONDS:-}
      OILSIGNAL_AGENT_PAYMENT_GATEWAY_ALLOW_INSECURE_HTTP: ${OILSIGNAL_AGENT_PAYMENT_GATEWAY_ALLOW_INSECURE_HTTP:-}
    command: >-
      sh -c "python examples/ingest_fixture.py --if-empty &&
      uvicorn oilsignal.api.server:app --host 0.0.0.0 --port 8000"
    volumes:
      - oilsignal-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  oilsignal-data:
