[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oilsignal"
version = "0.2.0"
description = "Evidence-first oil-market intelligence for U.S. petroleum fundamentals"
readme = {text = "OilSignal backend package", content-type = "text/markdown"}
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "OilSignal contributors"}]
dependencies = [
  "duckdb>=1.1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "polars>=1.8,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlmodel>=0.0.22,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
crypto = ["cryptography>=43,<47"]
dev = [
  "cryptography>=43,<47",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
oilsignal = "oilsignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oilsignal"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["../tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
